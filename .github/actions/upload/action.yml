name: 'Upload'
description: 'Upload package to server'
inputs:
  url: 
    description: 'Upload URL'
    required: true
  pass:
    description: 'Upload password'
    required: true
  pkg-name:
    description: 'Name of the file to upload'
    required: true

runs:
  using: "composite"
  steps: 
    - run: python "${{ github.action_path }}/upload.py"
      shell: bash
      env:
        UPLOAD_URL: ${{ inputs.url }}
        UPLOAD_PASSWORD: ${{ inputs.pass }}
        UPLOAD_FILE: ${{ inputs.pkg-name }}
